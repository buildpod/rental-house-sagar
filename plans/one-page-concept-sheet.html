
<!DOCTYPE html>

        <text x="115" y="425" text-anchor="middle" font-size="12">Entry Lobby</text>

        <rect x="150" y="350" width="150" height="150" fill="#e0e0e0" stroke="#333" stroke-width="2"/>
        <text x="225" y="415" text-anchor="middle" font-size="14" font-weight="bold">SUV Parking</text>
        <text x="225" y="435" text-anchor="middle" font-size="10">UG Tank Below</text>
