<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Ground floor corrected circulation plan</title>
  <desc id="desc">Ground floor plan corrected so the main tenant entry enters living and dining first, not the kitchen. White passage beside the master bedroom is labeled as private passage and wardrobe buffer. Door swings and windows are marked logically.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.plot{fill:#fff;stroke:#111;stroke-width:4}.wall{stroke:#111;stroke-width:4;fill:none}.room{fill:#fbfbfb;stroke:#111;stroke-width:2}.living{fill:#fffdf5;stroke:#111;stroke-width:2}.kitchen{fill:#fff0dc;stroke:#111;stroke-width:2}.wet{fill:#e2f1fb;stroke:#111;stroke-width:2}.shaft{fill:#eef1f2;stroke:#111;stroke-width:2}.parking{fill:#e6f1e6;stroke:#111;stroke-width:2}.stair{fill:#f3f3f3;stroke:#111;stroke-width:2}.passage{fill:#fff8d8;stroke:#111;stroke-width:2}.meter{fill:#ffd48a;stroke:#111;stroke-width:2}.pooja{fill:#fff4a8;stroke:#111;stroke-width:2}.label{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#111}.small{font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#333}.tiny{font-family:Arial,Helvetica,sans-serif;font-size:9px;fill:#555}.note{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#625f59}.door{fill:none;stroke:#d32f2f;stroke-width:2.5}.slide{stroke:#2e7d32;stroke-width:5;stroke-linecap:round}.window{stroke:#0b84b3;stroke-width:5;stroke-linecap:round}.vent{stroke:#0b84b3;stroke-width:3;stroke-linecap:round}.blocked{stroke:#777;stroke-width:2;stroke-dasharray:6 6}.route{fill:none;stroke:#2e7d32;stroke-width:3;stroke-dasharray:8 5;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2e7d32"/>
    </marker>
    <g id="north">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#333" stroke-width="2"/>
      <polygon points="-5,5 5,5 0,-16" fill="#333"/>
      <text x="0" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700">N</text>
    </g>
    <g id="stairLines">
      <line x1="0" y1="0" x2="0" y2="95" stroke="#bbb"/>
      <line x1="10" y1="0" x2="10" y2="95" stroke="#bbb"/>
      <line x1="20" y1="0" x2="20" y2="95" stroke="#bbb"/>
      <line x1="30" y1="0" x2="30" y2="95" stroke="#bbb"/>
      <line x1="40" y1="0" x2="40" y2="95" stroke="#bbb"/>
      <line x1="50" y1="0" x2="50" y2="95" stroke="#bbb"/>
      <line x1="60" y1="0" x2="60" y2="95" stroke="#bbb"/>
      <line x1="70" y1="0" x2="70" y2="95" stroke="#bbb"/>
      <line x1="80" y1="0" x2="80" y2="95" stroke="#bbb"/>
      <line x1="90" y1="0" x2="90" y2="95" stroke="#bbb"/>
      <line x1="100" y1="0" x2="100" y2="95" stroke="#bbb"/>
      <line x1="110" y1="0" x2="110" y2="95" stroke="#bbb"/>
      <line x1="120" y1="0" x2="120" y2="95" stroke="#bbb"/>
      <line x1="130" y1="0" x2="130" y2="95" stroke="#bbb"/>
      <line x1="140" y1="0" x2="140" y2="95" stroke="#bbb"/>
    </g>
  </defs>

  <rect class="bg" width="920" height="620"/>
  <g transform="translate(56,64)">
    <text x="0" y="-30" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#222">GROUND FLOOR PLAN - CORRECTED ENTRY FLOW</text>
    <text x="0" y="-10" class="note">Main person entry is from east lobby into living/dining first. Kitchen is reached after living/dining, not directly from the entrance.</text>

    <rect x="0" y="0" width="500" height="300" class="plot"/>
    <line x1="500" y1="-22" x2="500" y2="325" class="blocked"/>
    <text x="526" y="150" class="label" text-anchor="middle" transform="rotate(90 526 150)">30 FT ROAD - EAST / FRONT OPEN</text>
    <text x="250" y="326" text-anchor="middle" class="note">North, west, and south sides assumed blocked or constructed - windows only to east/front or OTS shafts.</text>

    <rect x="0" y="0" width="150" height="120" class="room"/>
    <text x="75" y="46" text-anchor="middle" class="label">BEDROOM 2</text>
    <text x="75" y="64" text-anchor="middle" class="small">15 ft x 12 ft</text>
    <text x="30" y="30" text-anchor="middle" class="tiny">bed</text>
    <text x="120" y="30" text-anchor="middle" class="tiny">wardrobe</text>

    <rect x="0" y="120" width="40" height="50" class="shaft"/>
    <line x1="0" y1="120" x2="40" y2="170" stroke="#aaa"/>
    <line x1="0" y1="170" x2="40" y2="120" stroke="#aaa"/>
    <text x="20" y="148" text-anchor="middle" class="tiny">OTS</text>
    <rect x="40" y="120" width="60" height="50" class="wet"/>
    <text x="70" y="141" text-anchor="middle" class="small" font-weight="700">ATT BATH</text>
    <text x="70" y="156" text-anchor="middle" class="tiny">6 ft x 5 ft</text>

    <rect x="0" y="170" width="150" height="130" class="room"/>
    <text x="75" y="228" text-anchor="middle" class="label">MASTER BED</text>
    <text x="75" y="246" text-anchor="middle" class="small">15 ft x 13 ft</text>
    <text x="30" y="282" text-anchor="middle" class="tiny">bed</text>
    <text x="120" y="282" text-anchor="middle" class="tiny">wardrobe</text>

    <rect x="150" y="0" width="50" height="50" class="shaft"/>
    <line x1="150" y1="0" x2="200" y2="50" stroke="#aaa"/>
    <line x1="150" y1="50" x2="200" y2="0" stroke="#aaa"/>
    <text x="175" y="28" text-anchor="middle" class="tiny">OTS</text>
    <rect x="200" y="0" width="50" height="70" class="wet"/>
    <text x="225" y="31" text-anchor="middle" class="small" font-weight="700">C.BATH</text>
    <text x="225" y="47" text-anchor="middle" class="tiny">5 ft x 7 ft</text>

    <rect x="150" y="50" width="50" height="250" class="passage"/>
    <text x="175" y="154" text-anchor="middle" class="small" font-weight="700" transform="rotate(-90 175 154)">PRIVATE PASSAGE</text>
    <text x="188" y="235" text-anchor="middle" class="tiny" transform="rotate(-90 188 235)">wardrobe / movement buffer</text>

    <rect x="200" y="70" width="150" height="135" class="living"/>
    <text x="275" y="124" text-anchor="middle" class="label">LIVING + DINING</text>
    <text x="275" y="142" text-anchor="middle" class="small">15 ft x 13.5 ft</text>
    <text x="230" y="178" text-anchor="middle" class="tiny">TV wall</text>
    <rect x="310" y="70" width="40" height="38" class="pooja"/>
    <text x="330" y="94" text-anchor="middle" class="tiny" font-weight="700">POOJA</text>

    <rect x="200" y="205" width="150" height="95" class="kitchen"/>
    <text x="275" y="244" text-anchor="middle" class="label">KITCHEN</text>
    <text x="275" y="262" text-anchor="middle" class="small">15 ft x 9.5 ft</text>
    <rect x="202" y="209" width="124" height="18" fill="#eee" stroke="#bbb"/>
    <text x="230" y="222" text-anchor="middle" class="tiny" fill="#b22222">stove</text>
    <text x="307" y="222" text-anchor="middle" class="tiny" fill="#0b6794">sink</text>
    <text x="225" y="286" text-anchor="middle" class="tiny">fridge</text>
    <text x="308" y="286" text-anchor="middle" class="tiny">WM</text>

    <rect x="350" y="0" width="150" height="150" class="parking"/>
    <text x="425" y="38" text-anchor="middle" class="label">COVERED SUV</text>
    <text x="425" y="56" text-anchor="middle" class="small">15 ft x 15 ft clear bay</text>
    <rect x="373" y="78" width="104" height="55" fill="#cfd8dc" stroke="#777" stroke-width="2"/>
    <text x="425" y="109" text-anchor="middle" class="tiny">SUV</text>
    <text x="425" y="140" text-anchor="middle" class="tiny">bike parking + UG sump</text>

    <rect x="350" y="150" width="150" height="55" class="living"/>
    <text x="425" y="174" text-anchor="middle" class="small" font-weight="700">ENTRY LOBBY</text>
    <text x="425" y="191" text-anchor="middle" class="tiny">tenant enters living from here</text>
    <rect x="480" y="150" width="20" height="55" class="meter"/>
    <text x="490" y="181" text-anchor="middle" class="tiny" transform="rotate(90 490 181)">METERS</text>

    <rect x="350" y="205" width="150" height="95" class="stair"/>
    <use href="#stairLines" x="350" y="205"/>
    <text x="425" y="254" text-anchor="middle" class="small" font-weight="700">COMMON STAIR</text>
    <text x="425" y="271" text-anchor="middle" class="tiny">separate upper-floor access</text>

    <line x1="150" y1="0" x2="150" y2="300" class="wall"/>
    <line x1="200" y1="0" x2="200" y2="70" class="wall"/>
    <line x1="200" y1="70" x2="200" y2="300" class="wall"/>
    <line x1="250" y1="0" x2="250" y2="70" class="wall"/>
    <line x1="350" y1="0" x2="350" y2="300" class="wall"/>
    <line x1="0" y1="120" x2="150" y2="120" class="wall"/>
    <line x1="0" y1="170" x2="200" y2="170" class="wall"/>
    <line x1="150" y1="50" x2="250" y2="50" class="wall"/>
    <line x1="200" y1="70" x2="350" y2="70" class="wall"/>
    <line x1="200" y1="205" x2="350" y2="205" class="wall"/>
    <line x1="350" y1="150" x2="500" y2="150" class="wall"/>
    <line x1="350" y1="205" x2="500" y2="205" class="wall"/>

    <path d="M350 172 L320 172 A30 30 0 0 0 350 202" class="door"/>
    <text x="310" y="194" text-anchor="end" class="tiny" fill="#b22222">MAIN DOOR - enters living/dining</text>
    <path d="M500 235 L470 235 A30 30 0 0 0 500 265" class="door"/>
    <text x="462" y="288" text-anchor="end" class="tiny" fill="#b22222">stair entry only</text>
    <path d="M150 82 L120 82 A30 30 0 0 0 150 112" class="door"/>
    <path d="M150 206 L120 206 A30 30 0 0 0 150 236" class="door"/>
    <line x1="40" y1="146" x2="100" y2="146" class="slide"/>
    <line x1="200" y1="36" x2="250" y2="36" class="slide"/>
    <line x1="232" y1="205" x2="318" y2="205" class="slide"/>
    <text x="275" y="199" text-anchor="middle" class="tiny" fill="#2e7d32">SLIDING / OPEN TO KITCHEN AFTER DINING</text>
    <line x1="200" y1="135" x2="200" y2="168" class="slide"/>
    <text x="207" y="152" class="tiny" fill="#2e7d32">opening to private passage</text>

    <path d="M500 166 C462 166 392 174 350 184" class="route"/>
    <text x="425" y="128" text-anchor="middle" class="small" fill="#2e7d32">ENTRY ROUTE: ROAD -> LOBBY -> LIVING/DINING</text>
    <path d="M284 198 C284 207 284 211 284 218" class="route"/>

    <line x1="502" y1="30" x2="502" y2="132" class="window"/>
    <line x1="502" y1="160" x2="502" y2="195" class="window"/>
    <line x1="502" y1="214" x2="502" y2="292" class="window"/>
    <line x1="40" y1="130" x2="40" y2="162" class="vent"/>
    <line x1="150" y1="18" x2="150" y2="46" class="vent"/>
    <line x1="200" y1="18" x2="200" y2="62" class="vent"/>
    <line x1="200" y1="238" x2="200" y2="282" class="vent"/>
    <text x="90" y="156" text-anchor="middle" class="tiny" fill="#0b6794">bath vents to OTS</text>

    <g transform="translate(620,0)">
      <text x="0" y="0" class="label">Logical Check</text>
      <text x="0" y="28" class="note">1. Person enters from east lobby into living/dining.</text>
      <text x="0" y="48" class="note">2. Kitchen is secondary, reached after dining.</text>
      <text x="0" y="68" class="note">3. Yellow strip beside master is not empty space.</text>
      <text x="0" y="88" class="note">   It is private passage + wardrobe/movement buffer.</text>
      <text x="0" y="108" class="note">4. Stair has separate entry for upper floors.</text>
      <text x="0" y="128" class="note">5. Blue windows/vents are only at front or shafts.</text>

      <text x="0" y="176" class="label">Symbols</text>
      <path d="M0 202 L30 202 A30 30 0 0 1 0 232" class="door"/>
      <text x="48" y="219" class="small">red = hinged door swing</text>
      <line x1="0" y1="252" x2="60" y2="252" class="slide"/>
      <text x="74" y="257" class="small">green = sliding/opening</text>
      <line x1="0" y1="282" x2="60" y2="282" class="window"/>
      <text x="74" y="287" class="small">blue = window/vent</text>
    </g>
  </g>
  <use href="#north" x="850" y="64"/>
</svg>
